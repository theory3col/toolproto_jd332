[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "theory3col-toolproto_jd332"
version = "0.1.0"
description = "从样本里推断工具调用协议工程师·流水线并行气泡比例应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "theory3col" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://theory3col.github.io"
Repository = "https://github.com/theory3col/toolproto_jd332"
Issues = "https://github.com/theory3col/toolproto_jd332/issues"

[project.scripts]
toolproto_jd332 = "toolproto_jd332:main"

[tool.setuptools]
py-modules = ["toolproto_jd332"]
